####################################################################################################
# Juice Stop — local development infrastructure
#
#   pnpm infra:up      start everything
#   pnpm infra:down    stop (data preserved)
#   pnpm infra:reset   stop AND destroy volumes
#
# Mirrors production dependencies exactly: same Postgres major, same PostGIS, same Redis major.
# Nothing here is exposed beyond localhost; these credentials are dev-only by design.
####################################################################################################

name: juice-stop-dev

services:
  postgres:
    # PostGIS is required for service-zone polygons (02-data-model.md §4.3)
    image: postgis/postgis:16-3.4-alpine
    container_name: js-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: juicestop
      POSTGRES_PASSWORD: juicestop_dev
      POSTGRES_DB: juicestop
      # Deterministic collation — avoids index corruption on glibc upgrades
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-IN --encoding=UTF8"
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juicestop -d juicestop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      # Dev-only tuning: log slow queries so index regressions surface early (README §3 invariant 10)
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "timezone=UTC"

  redis:
    image: redis:7-alpine
    container_name: js-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    # AOF on: BullMQ jobs and rate-limit buckets should survive a restart
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Stands in for DO Spaces / S3 — invoices, delivery proof photos
    image: minio/minio:latest
    container_name: js-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: juicestop
      MINIO_ROOT_PASSWORD: juicestop_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches all outbound email in dev. Web UI: http://localhost:8025
    # (Mailpit rather than MailHog — actively maintained, same SMTP interface.)
    image: axllent/mailpit:latest
    container_name: js-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
